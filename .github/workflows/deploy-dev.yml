name: Deploy Infra and App

on:
  push:
    branches: [dev-deployment]

jobs:
  infra:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[infra]') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.pull_request
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: <region>

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./infra

  app:
    runs-on: ubuntu-latest
    needs: [infra]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: <region>

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          docker build -t azilen-nestjs-dev .
          docker tag azilen-nestjs-dev:latest <aws_account_id>.dkr.ecr.<region>.amazonaws.com/azilen-nestjs-dev:latest
          docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/azilen-nestjs-dev:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster azilen-nestjs-dev-cluster --service azilen-nestjs-dev-service --force-new-deployment